name: Deploy Live Web Dashboard (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Refresh dashboard HTML (preserving real snapshot.json)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -c "from pathlib import Path; from cli_guard.dashboard.ui import DASHBOARD_HTML; Path('docs').mkdir(exist_ok=True); Path('docs/index.html').write_text(DASHBOARD_HTML, encoding='utf-8')"
          if [ ! -f docs/snapshot.json ]; then
            cg dashboard export --out docs
          fi
          ls -la docs

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
