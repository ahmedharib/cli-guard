[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cli-guard"
version = "0.1.0"
description = "Zero-execution supply-chain malware guard, lockfile auditor, and AI investigator for npm/pnpm/yarn/bun (with pluggable LLM backends)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "opentimestamps>=0.5.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
    "rich>=13.9.0",
    "tree-sitter>=0.23.0",
    "tree-sitter-javascript>=0.23.0",
    "tree-sitter-typescript>=0.23.0",
    "typer>=0.12.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
cg = "cli_guard.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/cli_guard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_default_fixture_loop_scope = "function"
